<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="The Allocation">
<meta name="theme-color" content="#f7f2eb">
<title>The Allocation</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --wine:#8b2635;--wine-deep:#6b1a27;--wine-light:#f9f0f2;
  --gold:#b8914a;--gold-light:#f5ead8;--gold-mid:#dfc98a;
  --cream:#f7f2eb;--warm:#fdfaf6;--bark:#7a6652;--bark-light:#ede5db;
  --ink:#2c2118;--ink2:#4a3728;--muted:#8a7a6a;
  --border:#e8ddd0;--border2:#d4c4b0;
  --green:#2d6a4f;--green-bg:#e8f5ee;
  --blue:#1a4f7a;--blue-bg:#e8f0f8;
  --amber:#a05c1a;--amber-bg:#fdf0e0;
  --purple:#5b21b6;--purple-bg:#f0ebff;
  --r:12px;--rlg:18px;
  --sh:0 1px 4px rgba(44,33,24,.08);
  --sh2:0 3px 12px rgba(44,33,24,.10);
  --serif:'Playfair Display',Georgia,serif;
  --sans:'Source Sans 3',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{font-family:var(--sans);background:var(--cream);color:var(--ink);min-height:100%}
::-webkit-scrollbar{width:0}

/* ── SHELL ── */
#app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:80px}
#toast{position:fixed;bottom:calc(88px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 22px;border-radius:32px;font-size:13px;font-weight:500;z-index:9999;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}

/* ── BOTTOM NAV ── */
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--warm);border-top:1px solid var(--border);display:flex;z-index:300;padding-bottom:env(safe-area-inset-bottom)}
.bntab{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 0 8px;cursor:pointer;border:none;background:none;gap:3px}
.bntab-ico{font-size:22px;line-height:1}
.bntab-lbl{font-size:10px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
.bntab.active .bntab-lbl{color:var(--wine)}
.bntab.active .bntab-ico{filter:drop-shadow(0 0 4px rgba(139,38,53,.3))}
.bntab-badge{background:var(--wine);color:#fff;border-radius:8px;font-size:9px;font-weight:700;padding:1px 5px;margin-left:2px}

/* ── SHARED HEADER ── */
.page-header{background:var(--warm);border-bottom:1px solid var(--border);padding:calc(50px + env(safe-area-inset-top)) 18px 14px;position:sticky;top:0;z-index:100}
.ph-row{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:12px}
.brand{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--wine)}
.brand-sub{font-size:10px;font-weight:500;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:1px}
.ph-action{background:var(--wine);color:#fff;border:none;border-radius:20px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer}
.hstats{display:flex;gap:18px}
.hstat-num{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--ink);line-height:1}
.hstat-lbl{font-size:9px;font-weight:500;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-top:2px}

/* ── SEARCH ── */
.search-wrap{padding:0 0 2px}
.sbox{display:flex;align-items:center;gap:8px;background:var(--cream);border:1.5px solid var(--border);border-radius:32px;padding:8px 14px}
.sbox input{flex:1;border:none;background:transparent;font-family:var(--sans);font-size:14px;color:var(--ink);outline:none;-webkit-user-select:text;user-select:text}
.sbox input::placeholder{color:var(--muted)}
.sico{color:var(--muted);font-size:15px;flex-shrink:0}
.sclr{color:var(--muted);font-size:18px;background:none;border:none;cursor:pointer;flex-shrink:0;padding:0}

/* ── SEGMENTED FILTER BAR (replaces scrolling tabs) ── */
.seg-filter-bar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--warm);border-bottom:1px solid var(--border)}
.seg-group{display:flex;flex:1;background:var(--cream);border-radius:10px;padding:2px}
.seg-tab{flex:1;padding:7px 4px;border:none;background:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);transition:all .15s;white-space:nowrap;font-family:var(--sans)}
.seg-tab.active{background:#fff;color:var(--wine);box-shadow:0 1px 4px rgba(44,33,24,.12)}
.more-filters-btn{background:none;border:1.5px solid var(--border2);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--bark);display:flex;align-items:center;gap:4px;white-space:nowrap;flex-shrink:0;font-family:var(--sans);transition:all .15s}
.more-filters-btn.has-filters{border-color:var(--wine);color:var(--wine);background:var(--wine-light)}

/* ── DASHBOARD ── */
.dash-hero{background:linear-gradient(160deg,var(--wine-deep),var(--wine));color:#fff;padding:calc(20px + env(safe-area-inset-top)) 20px 24px;position:relative;overflow:hidden}
.dash-hero::before{content:'';position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.06)}
.dash-hero::after{content:'';position:absolute;right:40px;bottom:-40px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.04)}
.dash-greeting{font-size:13px;opacity:.75;margin-bottom:4px}
.dash-main{font-family:var(--serif);font-size:34px;font-weight:700;margin-bottom:4px;letter-spacing:-.5px}
.dash-sub{font-size:14px;opacity:.8}
.dash-stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 12px}
.dash-stat{background:#fff;border-radius:var(--r);border:1px solid var(--border);padding:14px;box-shadow:var(--sh)}
.ds-lbl{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.ds-val{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--wine)}
.ds-note{font-size:11px;color:var(--muted);margin-top:2px}
.dash-section{padding:14px 12px 4px}
.dash-section-title{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
.activity-card{background:#fff;border-radius:var(--r);border:1px solid var(--border);padding:14px;margin:0 12px 12px;box-shadow:var(--sh)}
.act-row{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.act-row:last-child{border-bottom:none;padding-bottom:0}
.act-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px}
.dot-add{background:var(--wine)}.dot-drink{background:var(--gold)}.dot-ship{background:var(--green)}.dot-visit{background:var(--blue)}
.act-text{flex:1;font-size:14px;color:var(--ink)}
.act-time{font-size:12px;color:var(--muted);flex-shrink:0;margin-top:1px}
.drink-soon-card{background:var(--amber-bg);border:1px solid var(--gold-mid);border-radius:var(--r);padding:12px 14px;margin:0 12px 12px;font-size:13px;color:var(--amber);font-weight:500}
.upcoming-ship-card{background:#fff;border-radius:var(--r);border:1px solid var(--border);margin:0 12px 12px;box-shadow:var(--sh);overflow:hidden}
.usc-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border)}
.usc-row:last-child{border-bottom:none}
.usc-name{font-size:14px;font-weight:600;color:var(--ink)}
.usc-sub{font-size:12px;color:var(--muted);margin-top:1px}
.usc-date{font-size:13px;font-weight:700;color:var(--wine)}

/* ── EDITABLE SHIPMENT ROW ── */
.se-edit-btn{padding:4px 12px;border-radius:10px;background:var(--wine-light);color:var(--wine);border:none;font-size:12px;font-weight:600;cursor:pointer;flex-shrink:0}

/* ── TASTING FEE / WINE PURCHASED SPLIT on tour cards ── */
.tc-spend-split{display:flex;gap:0;margin-top:6px;background:var(--gold-light);border-radius:8px;overflow:hidden}
.tc-spend-col{flex:1;padding:6px 10px;text-align:center}
.tc-spend-col+.tc-spend-col{border-left:1px solid rgba(0,0,0,.07)}
.tc-spend-lbl{font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--amber);margin-bottom:2px}
.tc-spend-val{font-family:var(--serif);font-size:14px;font-weight:700;color:var(--amber)}

/* ── COLLAPSIBLE FORM SECTIONS ── */
.fcoll-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px;cursor:pointer;border-top:1px solid var(--border);margin-top:6px;user-select:none;-webkit-user-select:none}
.fcoll-hdr:active{opacity:.7}
.fcoll-title{font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--wine)}
.fcoll-arrow{font-size:18px;color:var(--muted);transition:transform .2s;line-height:1}
.fcoll-body{display:none}
.fcoll-body.open{display:block}

/* ── STOP PHOTO STRIP ── */
.stop-photo-strip{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.stop-photo-thumb{width:64px;height:64px;border-radius:8px;object-fit:cover;flex-shrink:0}
.stop-photo-add{width:64px;height:64px;border-radius:8px;background:var(--cream);border:1.5px dashed var(--border2);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;color:var(--muted);flex-shrink:0}

/* ── VISIT PHOTO STRIP ── */
.visit-photo-strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.visit-photo-strip::-webkit-scrollbar{display:none}
.visit-photo-thumb{width:90px;height:90px;border-radius:10px;object-fit:cover;flex-shrink:0}
.visit-photo-add-btn{width:90px;height:90px;border-radius:10px;background:var(--cream);border:1.5px dashed var(--border2);display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer;color:var(--muted);flex-shrink:0}



/* ── FILTER PANEL ── */
.fpanel{background:var(--warm);border-bottom:1px solid var(--border);padding:16px;display:none}
.fpanel.open{display:block}
.fp-hd{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.fp-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.fchip{padding:5px 13px;border-radius:20px;font-size:12px;font-weight:500;border:1.5px solid var(--border2);color:var(--bark);background:#fff;cursor:pointer;transition:all .15s}
.fchip.on{background:var(--wine);border-color:var(--wine);color:#fff}
.fp-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.fp-f label{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;display:block;margin-bottom:4px}
.fp-f input{width:100%;padding:7px 10px;border:1.5px solid var(--border);border-radius:8px;font-family:var(--sans);font-size:13px;color:var(--ink);background:#fff;outline:none}
.fp-acts{display:flex;gap:8px}
.fp-clear{flex:1;padding:9px;border-radius:8px;background:#fff;border:1.5px solid var(--border);color:var(--muted);font-size:13px;font-weight:600;cursor:pointer}
.fp-apply{flex:2;padding:9px;border-radius:8px;background:var(--wine);border:none;color:#fff;font-size:13px;font-weight:600;cursor:pointer}

/* ── SORT BAR ── */
.sbar{padding:8px 16px;display:flex;align-items:center;justify-content:space-between;background:var(--cream)}
.sbar-ct{font-size:12px;color:var(--muted);font-weight:500}
.sbar-btn{font-size:12px;color:var(--wine);font-weight:600;background:none;border:none;cursor:pointer}

/* ── WINE GRID ── */
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 12px 12px}
.wcard{background:#fff;border-radius:var(--rlg);overflow:hidden;cursor:pointer;border:1px solid var(--border);box-shadow:var(--sh);transition:transform .12s;-webkit-user-select:none;user-select:none}
.wcard:active{transform:scale(.965)}
.wc-img{height:180px;background:linear-gradient(160deg,#f0e6da,#e8d4c0);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.wc-img img{width:100%;height:100%;object-fit:cover;object-position:center top}
.bottle-svg{width:50px;opacity:.4}
.wc-type{position:absolute;bottom:8px;left:8px;padding:3px 8px;border-radius:20px;font-size:9px;font-weight:700;letter-spacing:.6px;text-transform:uppercase}
.tc-red{background:#8b2635;color:#fde8ea}.tc-white{background:#b8914a;color:#fff8ec}
.tc-rose{background:#c4517a;color:#fff0f5}.tc-sparkling{background:#3d7a8b;color:#e0f4f8}
.tc-blend{background:#4a3a8b;color:#ede0ff}.tc-other{background:#6b6b6b;color:#f2f2f2}
.wc-qty{position:absolute;top:8px;right:8px;background:rgba(44,33,24,.5);color:#fff;padding:2px 7px;border-radius:8px;font-size:10px;font-weight:700}
.wc-alloc{position:absolute;top:8px;left:8px;background:var(--gold);color:#fff;padding:2px 7px;border-radius:8px;font-size:9px;font-weight:700}
.sbar-fill{position:absolute;bottom:0;left:0;right:0;height:3px}
.sb-ready{background:#22c55e}.sb-soon{background:#f59e0b}.sb-hold{background:#94a3b8}.sb-past{background:#ef4444}
.wc-info{padding:10px 11px 12px}
.wc-winery{font-family:var(--serif);font-size:14px;font-weight:600;color:var(--ink);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wc-name{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wc-bot{display:flex;justify-content:space-between;align-items:center;margin-top:7px}
.wc-year{font-family:var(--serif);font-size:13px;font-weight:600;color:var(--wine)}
.wc-val{font-size:10px;color:var(--green);font-weight:600}

/* ── TOUR CARDS ── */
.tour-list{padding:0 12px 12px;display:flex;flex-direction:column;gap:12px}
.tour-card{background:#fff;border-radius:var(--rlg);border:1px solid var(--border);box-shadow:var(--sh);overflow:hidden;cursor:pointer;transition:transform .12s}
.tour-card:active{transform:scale(.98)}
.tc-hero{height:110px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.tc-hero img{width:100%;height:100%;object-fit:cover}
.tc-hero-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:48px}
.tc-hero-overlay{position:absolute;inset:0;background:linear-gradient(transparent 30%,rgba(44,33,24,.65))}
.tc-hero-info{position:absolute;bottom:10px;left:14px;right:14px}
.tc-hero-name{font-family:var(--serif);font-size:18px;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.3)}
.tc-hero-date{font-size:11px;color:rgba(255,255,255,.8);margin-top:2px}
.tc-body{padding:12px 14px}
.tc-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.tc-pill{padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600}
.tcp-stops{background:var(--blue-bg);color:var(--blue)}
.tcp-tasted{background:var(--wine-light);color:var(--wine)}
.tcp-clubs{background:var(--green-bg);color:var(--green)}
.tcp-spent{background:var(--gold-light);color:var(--amber)}
.tc-progress{height:6px;background:var(--bark-light);border-radius:3px;overflow:hidden;margin-top:4px}
.tc-progress-fill{height:100%;background:var(--wine);border-radius:3px}

/* ── TOUR DETAIL ── */
.tour-detail-header{background:linear-gradient(160deg,var(--wine-deep),var(--wine));padding:calc(52px + env(safe-area-inset-top)) 20px 20px;position:relative}
.tdh-back{position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px;width:36px;height:36px;border-radius:18px;background:rgba(255,255,255,.85);color:var(--ink);border:none;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tdh-acts{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;display:flex;gap:8px}
.tdh-btn{padding:6px 12px;border-radius:14px;background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.3);font-size:12px;font-weight:600;cursor:pointer}
.tdh-name{font-family:var(--serif);font-size:24px;font-weight:700;color:#fff;line-height:1.2}
.tdh-meta{font-size:13px;color:rgba(255,255,255,.75);margin-top:4px}
.tdh-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:16px}
.tdhs{background:rgba(255,255,255,.15);border-radius:10px;padding:10px;text-align:center}
.tdhs-num{font-family:var(--serif);font-size:20px;font-weight:700;color:#fff}
.tdhs-lbl{font-size:9px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:rgba(255,255,255,.65);margin-top:2px}

.tour-body{padding:16px}

/* Stop card */
.stop-card{background:#fff;border-radius:var(--r);border:1px solid var(--border);margin-bottom:12px;overflow:hidden;box-shadow:var(--sh)}
.stop-header{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;border-bottom:1px solid var(--border)}
.stop-num{width:28px;height:28px;border-radius:14px;background:var(--wine);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.stop-info{flex:1;min-width:0}
.stop-name{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--ink)}
.stop-meta{font-size:11px;color:var(--muted);margin-top:1px}
.stop-toggle{color:var(--muted);font-size:18px}
.stop-body{padding:12px 14px}

/* Wine tasting row */
.tasting-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.tasting-row:last-child{border-bottom:none}
.tr-stars{display:flex;gap:2px;flex-shrink:0}
.tr-star{font-size:14px;cursor:pointer;line-height:1}
.tr-info{flex:1;min-width:0}
.tr-winename{font-size:13px;font-weight:600;color:var(--ink)}
.tr-type{font-size:10px;color:var(--muted);font-weight:500}
.tr-notes{font-size:12px;color:var(--ink2);margin-top:3px;line-height:1.45}
.tr-actions{display:flex;gap:6px;margin-top:6px}
.tr-btn{padding:3px 10px;border-radius:10px;font-size:11px;font-weight:600;border:none;cursor:pointer}
.tr-add{background:var(--wine-light);color:var(--wine)}
.tr-add.added{background:var(--green-bg);color:var(--green)}
.tr-club{background:var(--gold-light);color:var(--amber)}
.tr-club.joined{background:var(--green-bg);color:var(--green)}

.add-tasting-btn{width:100%;padding:9px;border-radius:9px;background:var(--cream);border:1.5px dashed var(--border2);color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;margin-top:8px}
.add-stop-btn{width:100%;padding:12px;border-radius:var(--r);background:#fff;border:1.5px dashed var(--wine);color:var(--wine);font-family:var(--sans);font-size:14px;font-weight:600;cursor:pointer;margin-bottom:12px}

/* Tour summary card */
.summary-card{background:var(--wine);border-radius:var(--r);padding:16px;margin-bottom:16px;color:#fff}
.sc-title{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.6);margin-bottom:10px}
.sc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sc-item-lbl{font-size:11px;color:rgba(255,255,255,.6)}
.sc-item-val{font-family:var(--serif);font-size:16px;font-weight:600;color:#fff;margin-top:1px}

/* Flagged wines panel */
.flagged-section{background:var(--gold-light);border:1px solid var(--gold-mid);border-radius:var(--r);padding:14px;margin-bottom:12px}
.flagged-title{font-size:12px;font-weight:700;color:var(--amber);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px}
.flagged-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(0,0,0,.07)}
.flagged-row:last-child{border-bottom:none}
.fr-name{font-size:13px;font-weight:600;color:var(--ink)}
.fr-sub{font-size:11px;color:var(--muted)}
.fr-add-btn{padding:5px 12px;border-radius:10px;background:var(--wine);color:#fff;border:none;font-size:12px;font-weight:600;cursor:pointer;flex-shrink:0}
.fr-added{padding:5px 12px;border-radius:10px;background:var(--green-bg);color:var(--green);font-size:12px;font-weight:600}

/* ── CLUBS ── */

function bottleSVG(type,size=50){
  const c={'Red':'#8b2635','White':'#b8914a','Rosé':'#c4517a','Sparkling':'#3d7a8b','Blend':'#4a3a8b'}[type]||'#6b6b6b';
  return`<svg class="bottle-svg" width="${size}" viewBox="0 0 60 160" fill="none"><rect x="24" y="4" width="12" height="18" rx="3" fill="${c}" opacity=".6"/><path d="M18 22 Q10 40 10 70 L10 140 Q10 154 24 154 L36 154 Q50 154 50 140 L50 70 Q50 40 42 22 Z" fill="${c}" opacity=".45"/><rect x="18" y="72" width="24" height="2" rx="1" fill="white" opacity=".25"/><rect x="20" y="90" width="20" height="22" rx="3" fill="white" opacity=".1"/></svg>`;
}

function drinkStatus(w){
  const now=new Date().getFullYear();
  if(!w.drinkFrom&&!w.drinkTo)return null;
  if(w.drinkTo&&now>w.drinkTo)return{label:'Past peak',pill:'dwp-past',bar:'sb-past'};
  if(w.drinkFrom&&now<w.drinkFrom)return{label:`Hold — opens ${w.drinkFrom}`,pill:'dwp-hold',bar:'sb-hold'};
  if((w.drinkTo||w.drinkFrom)-now<=2)return{label:'Drink soon',pill:'dwp-soon',bar:'sb-soon'};
  return{label:'Ready to drink',pill:'dwp-ready',bar:'sb-ready'};
}

function sortWines(wines,key){
  const a=[...wines];
  if(key==='winery')return a.sort((x,y)=>x.winery.localeCompare(y.winery));
  if(key==='year_desc')return a.sort((x,y)=>(y.year||0)-(x.year||0));
  if(key==='year_asc')return a.sort((x,y)=>(x.year||0)-(y.year||0));
  if(key==='type')return a.sort((x,y)=>x.type.localeCompare(y.type));
  if(key==='region')return a.sort((x,y)=>(x.region||'').localeCompare(y.region||''));
  if(key==='abv')return a.sort((x,y)=>(y.abv||0)-(x.abv||0));
  if(key==='cellar')return a.sort((x,y)=>(x.cellarSection||'zzz').localeCompare(y.cellarSection||'zzz'));
  if(key==='drink')return a.sort((x,y)=>(x.drinkTo||9999)-(y.drinkTo||9999));
  if(key==='value')return a.sort((x,y)=>(y.estValue||0)-(x.estValue||0));
  if(key==='qty')return a.sort((x,y)=>(y.qty||1)-(x.qty||1));
  if(key==='cases')return a.sort((x,y)=>(x.casesProduced||99999)-(y.casesProduced||99999));
  return a.sort((x,y)=>(y.addedAt||0)-(x.addedAt||0));
}

function applyFilters(wines){
  const{filter,search,advFilters:af}=S;
  return wines.filter(w=>{
    if(filter!=='All'&&w.type!==filter&&!(filter==='Other'&&!['Red','White','Rosé','Sparkling','Blend'].includes(w.type)))return false;
    const q=search.toLowerCase();
    if(q){const fields=[w.winery,w.wineName,w.vineyard,w.region,w.country,w.winemakerName,String(w.year||''),w.cellarSection,w.notes,w.discoveredHow].map(x=>String(x||'').toLowerCase());if(!fields.some(f=>f.includes(q)))return false;}
    if(af.types.length&&!af.types.includes(w.type))return false;
    if(af.countries.length&&!af.countries.includes(w.country))return false;
    if(af.decades.length){const ds=Math.floor((w.year||0)/10)*10+'s';if(!af.decades.includes(ds))return false;}
    if(af.minAbv&&(w.abv||0)<parseFloat(af.minAbv))return false;
    if(af.maxAbv&&(w.abv||0)>parseFloat(af.maxAbv))return false;
    if(af.readyOnly){const st=drinkStatus(w);if(!st||st.pill!=='dwp-ready')return false;}
    if(af.hasAlloc&&!w.allocStatus)return false;
    return true;
  });
}
function hasAdv(){const af=S.advFilters;return af.types.length||af.countries.length||af.decades.length||af.minAbv||af.maxAbv||af.readyOnly||af.hasAlloc;}

let toastTimer;
function showToast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2500);}

function renderTourDetail(t){
  const stops=t.stops||[];
  const tasted=stops.reduce((s,st)=>s+(st.tastings||[]).length,0);
  const clubs=stops.reduce((s,st)=>s+(st.tastings||[]).filter(x=>x.clubJoined).length,0);
  const tastingFeesTotal=stops.reduce((s,st)=>s+(parseFloat(st.tastingFee)||0),0);
  const winePurchasedTotal=stops.reduce((s,st)=>s+(parseFloat(st.winePurchased)||0),0);
  const totalSpend=tastingFeesTotal+winePurchasedTotal||parseFloat(t.totalSpent)||0;
  const flagged=stops.reduce((a,st)=>{(st.tastings||[]).filter(x=>x.wantInCellar&&!x.addedToCellar).forEach(x=>a.push({...x,stopName:st.name}));return a;},[]);
  const photos=t.photos&&t.photos.length?t.photos:(t.image?[t.image]:[]);

  return`<div class="tour-detail-header">
    <button class="tdh-back" onclick="S.view='tourList';render()">‹</button>
    <div class="tdh-acts"><button class="tdh-btn" onclick="openTourForm(${t.id})">Edit</button><button class="tdh-btn" style="background:rgba(255,255,255,.1);color:rgba(255,255,255,.7)" onclick="deleteTour(${t.id})">Delete</button></div>
    <div class="tdh-name">${esc(t.name||'Unnamed Visit')}</div>
    <div class="tdh-meta">${fmtDate(t.date)}${t.location?` · ${esc(t.location)}`:''}</div>
    <div class="tdh-stats" style="grid-template-columns:1fr 1fr 1fr 1fr">
      <div class="tdhs"><div class="tdhs-num">${stops.length}</div><div class="tdhs-lbl">Stops</div></div>
      <div class="tdhs"><div class="tdhs-num">${tasted}</div><div class="tdhs-lbl">Tasted</div></div>
      <div class="tdhs"><div class="tdhs-num" style="font-size:${tastingFeesTotal>999?'13px':'20px'}">${tastingFeesTotal>0?fmt$(tastingFeesTotal):'—'}</div><div class="tdhs-lbl">Fees</div></div>
      <div class="tdhs"><div class="tdhs-num" style="font-size:${winePurchasedTotal>999?'13px':'20px'}">${winePurchasedTotal>0?fmt$(winePurchasedTotal):'—'}</div><div class="tdhs-lbl">Purchased</div></div>
    </div>
  </div>
  <div class="tour-body">
    ${photos.length?`<div style="display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px;padding-bottom:2px">${photos.map(p=>`<img src="${p}" style="width:110px;height:82px;object-fit:cover;border-radius:10px;flex-shrink:0">`).join('')}</div>`:''}
    ${t.notes?`<div class="dcard"><div class="dcard-title">Visit Notes</div><div style="font-size:14px;line-height:1.6;color:var(--ink2)">${esc(t.notes)}</div></div>`:''}
    ${totalSpend?`<div class="dcard" style="background:var(--gold-light);border-color:var(--gold-mid)"><div class="dcard-title">Spending Summary</div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;gap:10px">${tastingFeesTotal?`<div><div style="font-size:10px;font-weight:700;color:var(--amber);text-transform:uppercase;letter-spacing:.8px">Tasting fees</div><div style="font-family:var(--serif);font-size:18px;font-weight:700;color:var(--amber)">${fmt$(tastingFeesTotal)}</div></div>`:''}<div><div style="font-size:10px;font-weight:700;color:var(--amber);text-transform:uppercase;letter-spacing:.8px">Wine</div><div style="font-family:var(--serif);font-size:18px;font-weight:700;color:var(--amber)">${fmt$(winePurchasedTotal)}</div></div><div><div style="font-size:10px;font-weight:700;color:var(--amber);text-transform:uppercase;letter-spacing:.8px">Total</div><div style="font-family:var(--serif);font-size:22px;font-weight:700;color:var(--amber)">${fmt$(totalSpend)}</div></div></div></div>`:''}

    ${flagged.length?`<div class="flagged-section"><div class="flagged-title">⭐ Add to Your Cellar (${flagged.length})</div>${flagged.map(x=>`<div class="flagged-row"><div><div class="fr-name">${esc(x.wineName||x.stopName)}</div><div class="fr-sub">${esc(x.stopName)}${x.vintage?` · ${x.vintage}`:''}</div></div><button class="fr-add-btn" onclick="quickAddFromTour(${t.id},'${x.id}')">Add</button></div>`).join('')}</div>`:''}

    ${stops.map((stop,si)=>`<div class="stop-card"><div class="stop-header" onclick="toggleStop('stop_${t.id}_${si}')"><span class="stop-num">${si+1}</span><div class="stop-info"><div class="stop-name">${esc(stop.name||'Unnamed Winery')}</div><div class="stop-meta">${(stop.tastings||[]).length} tasted${stop.tastingFee?` · ${fmt$(stop.tastingFee)} fee`:''}${stop.winePurchased?` · ${fmt$(stop.winePurchased)} wine`:''}${stop.clubJoined?' · 🎉 Joined club':''}</div></div><span class="stop-toggle" id="stop_${t.id}_${si}_ico">▾</span></div>
      <div id="stop_${t.id}_${si}" style="display:block"><div class="stop-body">
        ${stop.notes?`<div style="font-size:13px;color:var(--muted);margin-bottom:10px;font-style:italic">${esc(stop.notes)}</div>`:''}
        ${(stop.photos&&stop.photos.length)?`<div style="display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px">${stop.photos.map(p=>`<img src="${p}" style="width:72px;height:72px;object-fit:cover;border-radius:8px;flex-shrink:0">`).join('')}</div>`:''}
        ${(stop.tastings||[]).length===0?`<div style="font-size:13px;color:var(--muted);text-align:center;padding:8px">No tastings logged yet</div>`:''}
        ${(stop.tastings||[]).map(tr=>`<div class="tasting-row">
          <div class="tr-stars">${[1,2,3,4,5].map(n=>`<span class="tr-star" onclick="rateTasting(${t.id},${si},'${tr.id}',${n})">${(tr.rating||0)>=n?'★':'☆'}</span>`).join('')}</div>
          <div class="tr-info">
            <div class="tr-winename">${esc(tr.wineName||'Unknown Wine')}</div>
            <div class="tr-type">${esc(tr.type||'')}${tr.vintage?` · ${tr.vintage}`:''}</div>
            ${tr.notes?`<div class="tr-notes">${esc(tr.notes)}</div>`:''}
            <div class="tr-actions">
              <button class="tr-btn tr-add${tr.addedToCellar?' added':''}" onclick="markWantCellar(${t.id},${si},'${tr.id}')">${tr.addedToCellar?'✓ In Cellar':tr.wantInCellar?'⭐ Flagged':'+ Want'}</button>
              <button class="tr-btn tr-club${tr.clubJoined?' joined':''}" onclick="markClubJoined(${t.id},${si},'${tr.id}')">${tr.clubJoined?'✓ Club Joined':'Join Club'}</button>
            </div>
          </div>
        </div>`).join('')}
        <button class="add-tasting-btn" onclick="openAddTasting(${t.id},${si})">+ Log a Wine Tasted</button>
        ${!stop.winemakerContact&&stop.clubJoined?'':stop.winemakerContact?`<div style="font-size:12px;color:var(--muted);margin-top:8px">📧 ${esc(stop.winemakerContact)}</div>`:''}
      </div></div>
    </div>`).join('')}

    <button class="add-stop-btn" onclick="addStopToTour(${t.id})">+ Add Winery Stop</button>
  </div>`;
}

// ── TAB: CLUBS ──

function renderClubs(){
  const{clubs}=S;
  const active=clubs.filter(c=>c.status==='Active').length;
  const annualTotal=clubs.filter(c=>c.status==='Active').reduce((s,c)=>s+(parseFloat(c.annualFee)||0),0);
  return`<div class="page-header">
    <div class="ph-row">
      <div><div class="brand" style="font-size:22px">Wine Clubs</div><div class="brand-sub">${active} active · ${annualTotal>0?fmt$(annualTotal)+'/yr':''}</div></div>
      <button class="ph-action" onclick="openClubForm(null)">+ Add Club</button>
    </div>
  </div>
  ${clubs.length===0?`<div class="empty"><div class="empty-ico">📬</div><div class="empty-h">No clubs yet</div><div class="empty-p">Track your wine club memberships, shipments, and benefits. They're often the best way to secure small-batch allocations.</div></div>`
  :`<div class="clubs-list">${[...clubs].sort((a,b)=>(a.status==='Active'?0:1)-(b.status==='Active'?0:1)).map(c=>{
    const ships=(c.shipments||[]);
    const nextShip=ships.find(s=>s.status==='Expected');
    const totalBtls=ships.filter(s=>s.status==='Received').reduce((s,x)=>s+(parseFloat(x.bottles)||0),0);
    return`<div class="club-card" onclick="openClubDetail(${c.id})">
      <div class="club-hero"><div class="club-logo">${c.image?`<img src="${c.image}" style="width:100%;height:100%;object-fit:cover;border-radius:12px">`:'🍷'}</div><div class="club-hero-info"><div class="club-hero-name">${esc(c.clubName||'Wine Club')}</div><div class="club-hero-winery">${esc(c.winery)}</div></div><span class="club-status cs-${(c.status||'Active').toLowerCase()}">${esc(c.status||'Active')}</span></div>
      <div class="club-body">
        <div class="club-kv">
          ${c.tier?`<span class="ck-k">Tier</span><span class="ck-v">${esc(c.tier)}</span>`:''}
          ${c.annualFee?`<span class="ck-k">Annual fee</span><span class="ck-v">${fmt$(c.annualFee)}</span>`:''}
          ${c.bottlesPerShipment?`<span class="ck-k">Per shipment</span><span class="ck-v">${c.bottlesPerShipment} bottles ${c.shipmentsPerYear?`· ${c.shipmentsPerYear}×/yr`:''}</span>`:''}
          ${totalBtls?`<span class="ck-k">Received total</span><span class="ck-v">${totalBtls} bottles</span>`:''}
        </div>
        ${nextShip?`<div class="club-next">📦 Next shipment expected: ${fmtDate(nextShip.date)}</div>`:''}
      </div>
    </div>`;}).join('')}</div>`}`;
}

// ── CLUB DETAIL ──
function renderClubDetail(c){
  const ships=(c.shipments||[]).slice().sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));
  const totalBtls=ships.filter(s=>s.status==='Received').reduce((s,x)=>s+(parseFloat(x.bottles)||0),0);
  const totalVal=ships.filter(s=>s.status==='Received').reduce((s,x)=>s+(parseFloat(x.value)||0),0);
  const shipmentsRec=ships.filter(s=>s.status==='Received').length;
  return`<div class="club-detail-header">
    <button class="cdh-back" onclick="S.view='clubList';render()">‹</button>
    <div class="cdh-acts"><button class="cdh-act" onclick="openClubForm(${c.id})">Edit</button><button class="cdh-act del" onclick="deleteClub(${c.id})">Delete</button></div>
    <div style="margin-top:8px"><div class="cdh-name">${esc(c.clubName||'Wine Club')}</div><div class="cdh-winery">${esc(c.winery)}</div></div>
    <div class="cdh-stats">
      <div class="cdhs"><div class="cdhs-num">${shipmentsRec}</div><div class="cdhs-lbl">Shipments</div></div>
      <div class="cdhs"><div class="cdhs-num">${totalBtls}</div><div class="cdhs-lbl">Bottles</div></div>
      <div class="cdhs"><div class="cdhs-num" style="font-size:${totalVal>999?'14px':'19px'}">${totalVal>0?fmt$(totalVal):'—'}</div><div class="cdhs-lbl">Value Rec'd</div></div>
    </div>
  </div>
  <div style="padding:16px">
    <div class="dcard"><div class="dcard-title">Membership Details</div><div class="kv">
      <span class="kv-k">Status</span><span class="kv-v"><span class="club-status cs-${(c.status||'').toLowerCase()}" style="position:static;padding:2px 9px">${esc(c.status||'Active')}</span></span>
      ${c.tier?`<span class="kv-k">Tier</span><span class="kv-v">${esc(c.tier)}</span>`:''}
      ${c.joinedDate?`<span class="kv-k">Member since</span><span class="kv-v">${fmtDate(c.joinedDate)}</span>`:''}
      ${c.joinedAt?`<span class="kv-k">Where joined</span><span class="kv-v">${esc(c.joinedAt)}</span>`:''}
      ${c.annualFee?`<span class="kv-k">Annual fee</span><span class="kv-v">${fmt$(c.annualFee)}</span>`:''}
      ${c.bottlesPerShipment?`<span class="kv-k">Bottles/shipment</span><span class="kv-v">${c.bottlesPerShipment}</span>`:''}
      ${c.shipmentsPerYear?`<span class="kv-k">Shipments/year</span><span class="kv-v">${c.shipmentsPerYear}</span>`:''}
      ${c.contactEmail?`<span class="kv-k">Contact</span><span class="kv-v">${esc(c.contactEmail)}</span>`:''}
      ${c.website?`<span class="kv-k">Website</span><span class="kv-v">${esc(c.website)}</span>`:''}
    </div></div>
    ${c.notes?`<div class="notes-card" style="margin-bottom:12px">"${esc(c.notes)}"</div>`:''}
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <div style="font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted)">Shipments</div>
      <button style="padding:5px 12px;border-radius:10px;background:var(--wine);color:#fff;border:none;font-size:12px;font-weight:600;cursor:pointer" onclick="openLogShipment(${c.id})">+ Log Shipment</button>
    </div>
    ${ships.length===0?`<div style="text-align:center;padding:20px;color:var(--muted);font-size:14px">No shipments logged yet</div>`:''}
    ${ships.map(s=>`<div class="shipment-entry"><div class="se-top"><span class="se-date">${fmtDate(s.date)}</span><div style="display:flex;align-items:center;gap:8px"><span class="se-status ses-${(s.status||'').toLowerCase()}">${esc(s.status)}</span><button class="se-edit-btn" onclick="openEditShipment(${c.id},'${s.id}')">Edit</button></div></div><div class="se-bottles">${s.bottles||0} bottles${s.value?` · ${fmt$(s.value)} value`:''}</div>${s.notes?`<div class="se-notes">${esc(s.notes)}</div>`:''}</div>`).join('')}
  </div>`;
}

// ══════════════════════════════════════════
// MAIN RENDER
// ══════════════════════════════════════════
let _ov=null;
function injectOverlay(html){closeOverlay();const d=document.createElement('div');d.innerHTML=html;_ov=d.firstElementChild;document.body.appendChild(_ov);}
function closeOverlay(){if(_ov&&_ov.parentNode)_ov.parentNode.removeChild(_ov);_ov=null;}

function render(){
  const app=document.getElementById('app');
  const{tab,view,selectedId,wines,tours,clubs}=S;

  if(view==='wineDetail'){const w=wines.find(x=>x.id===selectedId);if(w){app.innerHTML=renderWineDetail(w);window.scrollTo(0,0);}else{S.view='list';render();}
  }else if(view==='tourDetail'){const t=tours.find(x=>x.id===selectedId);if(t){app.innerHTML=renderTourDetail(t);window.scrollTo(0,0);}else{S.view='tourList';render();}
  }else if(view==='clubDetail'){const c=clubs.find(x=>x.id===selectedId);if(c){app.innerHTML=renderClubDetail(c);window.scrollTo(0,0);}else{S.view='clubList';render();}
  }else{
    if(tab==='home')app.innerHTML=renderHome();
    else if(tab==='cellar')app.innerHTML=renderCellar();
    else if(tab==='tours')app.innerHTML=renderTours();
    else if(tab==='clubs')app.innerHTML=renderClubs();
    bindSearch();
  }
  // Always inject nav (except full-screen detail views)
  const navEl=document.getElementById('navBar');if(navEl)navEl.remove();
  if(!['wineDetail','tourDetail','clubDetail'].includes(view)){
    const nb=document.createElement('div');nb.id='navBar';nb.innerHTML=renderNav();document.body.appendChild(nb);
  }
  closeOverlay();
}

function bindSearch(){
  const el=document.getElementById('searchInput');
  if(el){
    // Use direct DOM filtering instead of full re-render to preserve keyboard focus on iOS
    el.addEventListener('input',e=>{
      S.search=e.target.value;
      // Re-render only the wine grid, not the whole page
      filterWineGrid();
    });
    el.addEventListener('change',e=>{S.search=e.target.value;});
  }
  const cl=document.getElementById('searchClr');
  if(cl)cl.addEventListener('click',()=>{S.search='';render();});
}

function filterWineGrid(){
  // Update count display without full re-render
  const q=(S.search||'').toLowerCase();
  const filtered=applyFilters(sortWines(S.wines,S.sortKey));
  const ct=document.querySelector('.sbar-ct');
  if(ct){const tb=S.wines.reduce((s,w)=>s+(w.qty||1),0);const rn=S.wines.filter(w=>{const st=drinkStatus(w);return st&&st.pill==='dwp-ready';}).length;ct.textContent=`${filtered.length} wines · ${tb} bottles${rn?` · ${rn} ready`:''}`;} 
  // Show/hide cards
  document.querySelectorAll('.wcard').forEach((card,i)=>{
    const w=filtered[i];
    card.style.display=w?'':'none';
  });
  // If search changed which cards show, do a real render (but debounced to avoid focus loss)
  clearTimeout(window._searchTimer);
  window._searchTimer=setTimeout(()=>{if(document.activeElement!==document.getElementById('searchInput'))render();},800);
}

function switchTab(t){S.tab=t;S.view='list';S.search='';render();}

function renderHome(){
  const{wines,tours,clubs}=S;
  const tb=wines.reduce((s,w)=>s+(w.qty||1),0);
  const te=wines.reduce((s,w)=>s+((w.estValue||0)*(w.qty||1)),0);
  const consumed=wines.reduce((s,w)=>s+(w.openedLog||[]).length,0);
  const thisYear=new Date().getFullYear();
  const consumedThisYear=wines.reduce((s,w)=>s+(w.openedLog||[]).filter(o=>o.date&&o.date.startsWith(String(thisYear))).length,0);
  const totalTastingFees=tours.reduce((s,t)=>s+(t.stops||[]).reduce((ss,st)=>ss+(parseFloat(st.tastingFee)||0),0),0);
  const totalWinePurchased=tours.reduce((s,t)=>s+(t.stops||[]).reduce((ss,st)=>ss+(parseFloat(st.winePurchased)||0),0),0)+clubs.reduce((s,c)=>s+(c.shipments||[]).filter(sh=>sh.status==='Received').reduce((ss,sh)=>ss+(parseFloat(sh.value)||0),0),0);
  const drinkSoon=wines.filter(w=>{const st=drinkStatus(w);return st&&(st.pill==='dwp-soon'||st.pill==='dwp-past');}).slice(0,3);
  const upcomingShips=clubs.flatMap(c=>(c.shipments||[]).filter(s=>s.status==='Expected').map(s=>({...s,clubName:c.clubName||c.winery}))).slice(0,3);
  const recentActivity=[];
  [...wines].sort((a,b)=>(b.addedAt||0)-(a.addedAt||0)).slice(0,2).forEach(w=>recentActivity.push({dot:'dot-add',text:`Added <strong>${esc(w.winery)}${w.wineName?' '+esc(w.wineName):''}</strong> × ${w.qty||1}`,time:'Recently'}));
  wines.forEach(w=>(w.openedLog||[]).slice(0,1).forEach(o=>recentActivity.push({dot:'dot-drink',text:`Consumed <strong>${esc(w.winery)}</strong>${o.occasion?` · ${esc(o.occasion)}`:''}`,time:o.date?fmtDate(o.date):''})));
  [...tours].sort((a,b)=>new Date(b.date||0)-new Date(a.date||0)).slice(0,1).forEach(t=>recentActivity.push({dot:'dot-visit',text:`Visit — <strong>${esc(t.name||'Unnamed')}</strong>`,time:fmtDate(t.date)}));
  clubs.forEach(c=>(c.shipments||[]).filter(s=>s.status==='Received').slice(0,1).forEach(s=>recentActivity.push({dot:'dot-ship',text:`Shipment received — <strong>${esc(c.winery)}</strong>${s.bottles?` × ${s.bottles}`:''}`,time:fmtDate(s.date)})));

  return`<div class="dash-hero">
    <div class="dash-greeting">The Allocation</div>
    <div class="dash-main">${tb} bottle${tb!==1?'s':''}</div>
    <div class="dash-sub">${te>0?`Est. value · ${fmt$(te)}`:'Start adding wines to your cellar'}</div>
  </div>
  <div class="dash-stat-grid">
    <div class="dash-stat"><div class="ds-lbl">In cellar</div><div class="ds-val">${tb}</div><div class="ds-note">${wines.length} wine${wines.length!==1?'s':''}</div></div>
    <div class="dash-stat"><div class="ds-lbl">Consumed</div><div class="ds-val">${consumed}</div><div class="ds-note">${consumedThisYear} this year</div></div>
    <div class="dash-stat"><div class="ds-lbl">Tasting fees</div><div class="ds-val">${totalTastingFees>0?fmt$(totalTastingFees):'—'}</div><div class="ds-note">Across ${tours.length} visit${tours.length!==1?'s':''}</div></div>
    <div class="dash-stat"><div class="ds-lbl">Wine purchased</div><div class="ds-val">${totalWinePurchased>0?fmt$(totalWinePurchased):'—'}</div><div class="ds-note">Visits + clubs</div></div>
  </div>
  ${drinkSoon.length?`<div class="dash-section"><div class="dash-section-title">Drink soon</div></div>
  <div class="drink-soon-card">⏳ ${drinkSoon.map(w=>`${w.year?w.year+' ':''}${esc(w.winery)}${w.wineName?' '+esc(w.wineName):''}`).join(' · ')} — check drinking windows</div>`:''}
  <div class="dash-section"><div class="dash-section-title">Recent activity</div></div>
  ${recentActivity.length?`<div class="activity-card">${recentActivity.slice(0,5).map(a=>`<div class="act-row"><div class="act-dot ${a.dot}"></div><div class="act-text">${a.text}</div><div class="act-time">${a.time}</div></div>`).join('')}</div>`:`<div class="activity-card" style="text-align:center;color:var(--muted);padding:20px">Nothing logged yet — add your first wine!</div>`}
  ${upcomingShips.length?`<div class="dash-section"><div class="dash-section-title">Upcoming club shipments</div></div>
  <div class="upcoming-ship-card">${upcomingShips.map(s=>`<div class="usc-row"><div><div class="usc-name">${esc(s.clubName)}</div><div class="usc-sub">${s.bottles?s.bottles+' bottles':''}</div></div><div class="usc-date">${fmtDate(s.date)}</div></div>`).join('')}</div>`:''}
  <div style="height:90px"></div>`;
}

      <div class="fg"><label>Contents / Notes</label><textarea class="fi" id="es_notes" rows="3">${esc(s.notes||'')}</textarea></div>
      <button class="save-btn" onclick="saveEditShipment(${clubId},'${shipId}')">Save Changes</button>

function saveEditShipment(clubId,shipId){

function refreshBlendRows(){const c=document.getElementById('blendRows');if(!c)return;c.innerHTML=FD.blend.map((b,i)=>`<div class="blend-row-f"><select class="fi" id="bv${i}" onchange="FD.blend[${i}].variety=this.value"><option value="">Select variety</option>${BLEND_VARS.map(v=>`<option${b.variety===v?' selected':''}>${esc(v)}</option>`).join('')}</select><input class="fi blend-pct" id="bp${i}" type="number" min="0" max="100" placeholder="%" value="${b.pct||''}"><button class="blend-rm" onclick="removeBlend(${i})">×</button></div>`).join('');updateBlendTotal();}
function updateBlendTotal(){const el=document.getElementById('blendTotal');if(!el)return;FD.blend.forEach((b,i)=>{const e=document.getElementById(`bp${i}`);if(e)b.pct=e.value;});const t=FD.blend.reduce((s,b)=>s+(parseFloat(b.pct)||0),0);if(t>0){el.style.display='block';el.style.color=t===100?'#2d6a4f':'#b91c1c';el.textContent=`Total: ${t}% ${t===100?'✓':'(must equal 100%)'}`;}else el.style.display='none';}
function onTypeChange(v){FD.type=v;const s=document.getElementById('blendSection');if(s)s.style.display=v==='Blend'?'block':'none';if(v==='Blend'&&FD.blend.length===0)FD.blend.push({variety:'',pct:''});refreshBlendRows();}
function addBlend(){FD.blend.forEach((b,i)=>{const e=document.getElementById(`bp${i}`);if(e)b.pct=e.value;const ev=document.getElementById(`bv${i}`);if(ev)b.variety=ev.value;});FD.blend.push({variety:'',pct:''});refreshBlendRows();}
function removeBlend(i){FD.blend.forEach((b,j)=>{const e=document.getElementById(`bp${j}`);if(e)b.pct=e.value;const ev=document.getElementById(`bv${j}`);if(ev)b.variety=ev.value;});FD.blend.splice(i,1);refreshBlendRows();}

// Temp storage for stop photos while adding a stop
let _stopPhotos=[];
function addStopPhoto(){document.getElementById('stopPhotoInput').click();}
function handleStopPhoto(input){
  const file=input.files[0];if(!file)return;
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{
    const MAX=900,sc=Math.min(1,MAX/Math.max(img.width,img.height));
    const cv=document.createElement('canvas');cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
    cv.getContext('2d').drawImage(img,0,0,img.width,img.height,0,0,cv.width,cv.height);
    const data=cv.toDataURL('image/jpeg',.80);URL.revokeObjectURL(url);
    _stopPhotos.push(data);
    const strip=document.getElementById('stopPhotoStrip');
    if(strip)strip.innerHTML=_stopPhotos.map((p,i)=>`<img src="${p}" class="stop-photo-thumb">`).join('')+`<div class="stop-photo-add" onclick="addStopPhoto()">+<input type="file" id="stopPhotoInput" accept="image/*" style="display:none" onchange="handleStopPhoto(this)"></div>`;
  };img.src=url;
}

function addVisitPhoto(){document.getElementById('visitPhotoInput').click();}
function retakeVisitPhoto(idx){
  // remove photo at idx
  if(!TFD.photos)TFD.photos=[];
  TFD.photos.splice(idx,1);
  // re-render strip
  const strip=document.getElementById('visitPhotoStrip');
  if(strip)strip.innerHTML=(TFD.photos.map((p,i)=>`<img src="${p}" class="visit-photo-thumb" onclick="retakeVisitPhoto(${i})">`).join(''))+`<div class="visit-photo-add-btn" onclick="addVisitPhoto()">+<input type="file" id="visitPhotoInput" accept="image/*" style="display:none" onchange="handleVisitPhoto(this)"></div>`;
}
function handleVisitPhoto(input){
  const file=input.files[0];if(!file)return;
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{
    const MAX=1200,sc=Math.min(1,MAX/Math.max(img.width,img.height));
    const cv=document.createElement('canvas');cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
    cv.getContext('2d').drawImage(img,0,0,img.width,img.height,0,0,cv.width,cv.height);
    const data=cv.toDataURL('image/jpeg',.82);URL.revokeObjectURL(url);
    if(!TFD.photos)TFD.photos=[];
    TFD.photos.push(data);
    const strip=document.getElementById('visitPhotoStrip');
    if(strip)strip.innerHTML=(TFD.photos.map((p,i)=>`<img src="${p}" class="visit-photo-thumb" onclick="retakeVisitPhoto(${i})">`).join(''))+`<div class="visit-photo-add-btn" onclick="addVisitPhoto()">+<input type="file" id="visitPhotoInput" accept="image/*" style="display:none" onchange="handleVisitPhoto(this)"></div>`;
  };img.src=url;
}

function handleExtraPhoto(input,zoneId,idx){
  const file=input.files[0];if(!file)return;
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{
    const MAX=900,sc=Math.min(1,MAX/Math.max(img.width,img.height));
    const cv=document.createElement('canvas');cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
    cv.getContext('2d').drawImage(img,0,0,img.width,img.height,0,0,cv.width,cv.height);
    const data=cv.toDataURL('image/jpeg',.80);URL.revokeObjectURL(url);
    if(!FD.extraPhotos)FD.extraPhotos=[];
    FD.extraPhotos[idx]=data;
    const z=document.getElementById(zoneId);
    if(z)z.innerHTML=`<img src="${data}" style="width:100%;height:100%;object-fit:cover;border-radius:10px"><input type="file" id="extraPhotoInput${idx+1}" accept="image/*" capture="environment" style="display:none" onchange="handleExtraPhoto(this,'${zoneId}',${idx})">`;
  };img.src=url;
}

function handlePhoto(input,zoneId,mode){
  const file=input.files[0];if(!file)return;
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{
    let sx=0,sy=0,sw=img.width,sh=img.height;
    if(mode==='portrait'){const tr=3/4;if(img.width/img.height>tr){sw=Math.round(img.height*tr);sx=Math.round((img.width-sw)/2);}else{sh=Math.round(img.width/tr);sy=0;}}
    const MAX=900,sc=Math.min(1,MAX/Math.max(sw,sh));
    const cv=document.createElement('canvas');cv.width=Math.round(sw*sc);cv.height=Math.round(sh*sc);
    cv.getContext('2d').drawImage(img,sx,sy,sw,sh,0,0,cv.width,cv.height);
    const data=cv.toDataURL('image/jpeg',.85);URL.revokeObjectURL(url);
    if(zoneId==='photoZone')FD.image=data;
    const z=document.getElementById(zoneId);
    if(z)z.innerHTML=`<img src="${data}" alt="photo" style="width:100%;height:100%;object-fit:cover">${mode==='portrait'?`<button class="pz-retake" onclick="event.stopPropagation();document.getElementById('photoInput').click()">Retake</button>`:''}`;
  };img.src=url;
}

function saveTourForm(){
  const g=id=>{const el=document.getElementById(id);return el?(el.tagName==='TEXTAREA'?el.value:el.value.trim()):'';}
  const name=g('t_name');if(!name){alert('Visit name is required');return;}
  // Auto-calc totalSpent from stops
  const stops=TFD.stops||[];
  const totalSpent=stops.reduce((s,st)=>s+(parseFloat(st.tastingFee)||0)+(parseFloat(st.winePurchased)||0),0)||null;
  const tour={id:TFD.id||Date.now(),addedAt:TFD.addedAt||Date.now(),name,date:g('t_date'),location:g('t_location'),notes:g('t_notes'),image:TFD.photos&&TFD.photos[0]?TFD.photos[0]:TFD.image||null,photos:TFD.photos||[],stops,totalSpent};
  const isEdit=TFD.id&&S.tours.find(t=>t.id===TFD.id);
  S.tours=isEdit?S.tours.map(t=>t.id===tour.id?tour:t):[tour,...S.tours];
  save();closeOverlay();S.selectedId=tour.id;S.view='tourDetail';
  render();showToast(isEdit?'Visit updated!':'Visit created!');
}

function addStopToTour(tourId){injectOverlay(renderAddStop(tourId));}

function saveStop(tourId){
  const g=id=>{const el=document.getElementById(id);return el?el.value.trim():'';}
  const name=g('as_name');if(!name){alert('Winery name is required');return;}
  const stop={id:Date.now(),name,time:g('as_time'),tastingFee:parseFloat(g('as_fee'))||null,winePurchased:parseFloat(g('as_winePurchased'))||null,winemakerContact:g('as_contact'),notes:g('as_notes'),photos:[..._stopPhotos],tastings:[],clubJoined:false};
  _stopPhotos=[];
  const tour=S.tours.find(t=>t.id===tourId);if(!tour)return;
  if(!tour.stops)tour.stops=[];
  tour.stops.push(stop);
  // Auto-calc totalSpent from stops
  tour.totalSpent=tour.stops.reduce((s,st)=>s+(parseFloat(st.tastingFee)||0)+(parseFloat(st.winePurchased)||0),0)||null;
  S.tours=S.tours.map(t=>t.id===tourId?tour:t);
  save();closeOverlay();S.selectedId=tourId;S.view='tourDetail';render();showToast('Stop added!');
}

function saveTasting(tourId,stopIdx){
  const g=id=>{const el=document.getElementById(id);return el?(el.tagName==='TEXTAREA'?el.value:el.value.trim()):'';}
  const wineName=g('at_wineName');if(!wineName){alert('Wine name is required');return;}
  const rEl=document.getElementById('at_rating');
  const tasting={id:String(Date.now()),wineName,type:g('at_type'),vintage:parseInt(g('at_vintage'))||null,rating:parseInt(rEl?.value)||0,notes:g('at_notes'),wantInCellar:document.getElementById('at_wantInCellar')?.checked||false,clubJoined:document.getElementById('at_clubJoined')?.checked||false,addedToCellar:false};
  const tour=S.tours.find(t=>t.id===tourId);if(!tour)return;
  if(!tour.stops[stopIdx])return;
  if(!tour.stops[stopIdx].tastings)tour.stops[stopIdx].tastings=[];
  tour.stops[stopIdx].tastings.push(tasting);
  if(tasting.clubJoined)tour.stops[stopIdx].clubJoined=true;
  S.tours=S.tours.map(t=>t.id===tourId?tour:t);
  save();closeOverlay();S.selectedId=tourId;S.view='tourDetail';render();showToast('Tasting logged!');
}

function setTastingRating(n){
  document.getElementById('at_rating').value=n;
  [1,2,3,4,5].forEach(i=>{const s=document.getElementById(`at_star_${i}`);if(s)s.textContent=i<=n?'★':'☆';});
}

function rateTasting(tourId,stopIdx,tastingId,rating){
  const tour=S.tours.find(t=>t.id===tourId);if(!tour)return;
  const t=tour.stops[stopIdx]?.tastings?.find(x=>x.id===tastingId);
  if(t){t.rating=rating;S.tours=S.tours.map(x=>x.id===tourId?tour:x);save();S.selectedId=tourId;S.view='tourDetail';render();}
}

function markWantCellar(tourId,stopIdx,tastingId){
  const tour=S.tours.find(t=>t.id===tourId);if(!tour)return;
  const t=tour.stops[stopIdx]?.tastings?.find(x=>x.id===tastingId);
  if(t){t.wantInCellar=!t.wantInCellar;S.tours=S.tours.map(x=>x.id===tourId?tour:x);save();S.selectedId=tourId;S.view='tourDetail';render();}
}

function markClubJoined(tourId,stopIdx,tastingId){
  const tour=S.tours.find(t=>t.id===tourId);if(!tour)return;
  const t=tour.stops[stopIdx]?.tastings?.find(x=>x.id===tastingId);
  if(t){t.clubJoined=!t.clubJoined;if(t.clubJoined)tour.stops[stopIdx].clubJoined=true;S.tours=S.tours.map(x=>x.id===tourId?tour:x);save();S.selectedId=tourId;S.view='tourDetail';render();}
}

function quickAddFromTour(tourId,tastingId){
  // Find the tasting and pre-fill a wine form
  const tour=S.tours.find(t=>t.id===tourId);if(!tour)return;
  let tasting=null,stopName='';
  tour.stops.forEach(s=>{const tr=s.tastings?.find(x=>x.id===tastingId);if(tr){tasting=tr;stopName=s.name;}});
  if(!tasting)return;
  initFD(null);
  FD.winery=stopName;FD.wineName=tasting.wineName;FD.type=tasting.type||'Red';FD.year=tasting.vintage;FD.discoveredHow=`Tour: ${tour.name||''}`;
  injectOverlay(renderWineForm());refreshBlendRows();
  // Mark as added when saved — handled via save
  showToast('Pre-filled from tasting — complete and save!');
}

function deleteTour(id){
  if(!confirm('Delete this visit and all its data?'))return;
  S.tours=S.tours.filter(t=>t.id!==id);save();S.view='tourList';S.tab='tours';render();showToast('Visit deleted');
}

function saveShipment(clubId){

  const ship={id:Date.now(),date:g('ls_date'),status:g('ls_status')||'Received',bottles:parseInt(g('ls_bottles'))||null,value:parseFloat(g('ls_value'))||null,notes:g('ls_notes')};

// OPENED LOG
// ══════════════════════════════════════════
function saveOpenedLog(wineId){
  const g=id=>{const el=document.getElementById(id);return el?(el.tagName==='TEXTAREA'?el.value:el.value.trim()):'';}
  const entry={date:g('lo_date')||today(),occasion:g('lo_occasion'),pairedWith:g('lo_pairedWith'),notes:g('lo_notes')};
  const wine=S.wines.find(w=>w.id===wineId);if(!wine)return;
  if(!wine.openedLog)wine.openedLog=[];
  wine.openedLog.unshift(entry);
  if(wine.qty>1)wine.qty--;
  S.wines=S.wines.map(w=>w.id===wineId?wine:w);
  save();closeOverlay();S.selectedId=wineId;S.view='wineDetail';render();showToast('Opening logged!');
}

  closeOverlay();showToast('JSON exported!');
}

render();
